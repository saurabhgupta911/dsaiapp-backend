<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100">
    <div class="w-full max-w-lg mx-auto bg-white min-h-screen shadow-lg">
        <header class="bg-gradient-to-r from-slate-600 to-gray-800 text-white p-4 sticky top-0 z-10 flex items-center shadow-md">
            <a href="index.html" class="mr-4 p-2 rounded-full hover:bg-white/20">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="w-10 h-10 bg-white/30 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div class="ml-4">
                <h1 class="text-xl font-bold">General Information</h1>
                <p class="text-sm opacity-80">Timings, Contacts & Policies</p>
            </div>
        </header>
        <div id="loader" class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-gray-700"></div>
        </div>
        <main id="admin-container" class="p-4 sm:p-6 space-y-6 hidden">
            <div class="bg-white rounded-xl shadow-md p-5">
                <h3 class="text-lg font-bold text-slate-800">College Timings</h3>
                <ul class="mt-3 space-y-2 text-sm">
                    <li class="flex justify-between"><strong>Office Hours:</strong> <span id="office-hours"></span></li>
                    <li class="flex justify-between"><strong>Library Hours:</strong> <span id="library-hours"></span></li>
                    <li class="flex justify-between"><strong>Canteen Hours:</strong> <span id="canteen-hours"></span></li>
                </ul>
            </div>
            <div class="bg-white rounded-xl shadow-md p-5">
                <h3 class="text-lg font-bold text-slate-800">Contact Information</h3>
                <ul class="mt-3 space-y-2 text-sm">
                    <li class="flex justify-between"><strong>Principal:</strong> <span id="principal-name"></span></li>
                    <li class="flex justify-between"><strong>Email:</strong> <span id="general-email" class="text-blue-600"></span></li>
                    <li class="flex justify-between"><strong>Phone:</strong> <span id="landline-1"></span></li>
                    <li class="flex flex-col mt-2"><strong>Address:</strong> <span id="address" class="text-slate-600"></span></li>
                </ul>
            </div>
             <div class="bg-white rounded-xl shadow-md p-5">
                <h3 class="text-lg font-bold text-slate-800">College Policies</h3>
                <div class="mt-3 space-y-3 text-sm">
                    <div><strong>Attendance:</strong> <span id="attendance-policy" class="text-slate-600"></span></div>
                    <div><strong>ID Card:</strong> <span id="id-card-policy" class="text-slate-600"></span></div>
                    <div><strong>Anti-Ragging Helpline:</strong> <span id="anti-ragging-helpline" class="font-semibold text-red-600"></span></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

       
        const firebaseConfig = {
            apiKey: "AIzaSyB8iYFnVqzBJ2uS6j_LQdF101FL_4ofjjo",
            authDomain: "dsai-app.firebaseapp.com",
            projectId: "dsai-app",
            storageBucket: "dsai-app.appspot.com",
            messagingSenderId: "404556059210",
            appId: "1:404556059210:web:fd8a486f3a864fb6020cb3",
            measurementId: "G-7KXG3VB88C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const adminContainer = document.getElementById('admin-container');
        const loader = document.getElementById('loader');

        const displayAdminInfo = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "adminInfo"));
                
                let allAdminData = {};
                querySnapshot.forEach((doc) => {
                    // Saare documents ke data ko ek hi object mein merge kar do
                    Object.assign(allAdminData, doc.data());
                });

                // Ab data ko HTML elements mein daalo
                document.getElementById('office-hours').textContent = allAdminData.office_hours || 'N/A';
                document.getElementById('library-hours').textContent = allAdminData.library_hours || 'N/A';
                document.getElementById('canteen-hours').textContent = allAdminData.canteen_hours || 'N/A';
                document.getElementById('principal-name').textContent = allAdminData.principal_name || 'N/A';
                document.getElementById('general-email').textContent = allAdminData.general_email || 'N/A';
                document.getElementById('landline-1').textContent = allAdminData.landline_1 || 'N/A';
                document.getElementById('address').textContent = allAdminData.address || 'N/A';
                document.getElementById('attendance-policy').textContent = allAdminData.attendance_policy || 'N/A';
                document.getElementById('id-card-policy').textContent = allAdminData.id_card_policy || 'N/A';
                document.getElementById('anti-ragging-helpline').textContent = allAdminData.anti_ragging_helpline || 'N/A';
                
            } catch (error) {
                console.error("Error fetching admin data: ", error);
                adminContainer.innerHTML = '<p class="text-center text-red-500">Could not load admin data.</p>';
            } finally {
                loader.style.display = 'none';
                adminContainer.classList.remove('hidden');
            }
        };

        displayAdminInfo();
    </script>
</body>
</html>
