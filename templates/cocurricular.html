<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-Curricular Activities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Customizable Color Variables --- */
        :root {
            --primary-color-light: #fcd34d; /* For gradients, brighter accents */
            --primary-color-dark: #f59e0b;  /* For gradients, darker accents */
            --header-bg-start: var(--primary-color-dark); /* orange-500 */
            --header-bg-end: #d97706; /* amber-600, slightly darker for gradient */
            --page-bg: #1a1a1a; /* Dark background for the entire page */
            --app-container-bg: #262626; /* Slightly lighter dark for main content area */
            --card-bg: #363636; /* Card background */
            --text-primary: #f5f5f5; /* Light text for general content */
            --text-secondary: #d4d4d4; /* Slightly dimmer text */
            --text-heading: var(--primary-color-light); /* Accent color for headings */
            --text-subtitle: #a3a3a3; /* Subtitles/descriptions */
            --border-divider: #4a4a4a; /* Divider lines */
            --icon-color: #f5f5f5; /* Icon color in header */
            --loader-color: var(--primary-color-light); /* Loader spin color */
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--page-bg); 
            color: var(--text-primary);
        } 
        .app-container {
            background-color: var(--app-container-bg);
            color: var(--text-primary);
        }
        .header-bg {
            background-image: linear-gradient(to right, var(--header-bg-start), var(--header-bg-end));
            color: var(--icon-color);
        }
        .header-icon {
            color: var(--icon-color);
        }
        .activity-card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        .activity-card-content {
            padding: 1.25rem; /* p-5 equivalent */
        }
        .activity-description-clickable {
            color: var(--text-secondary);
            cursor: pointer; /* Indicate clickable */
            transition: color 0.2s ease;
            margin-top: 0.5rem; /* mt-2 equivalent */
        }
        .activity-description-clickable:hover {
            color: var(--primary-color-light); /* Highlight on hover */
        }
        .activity-title {
            color: var(--text-heading);
        }
        .border-dark {
            border-color: var(--border-divider);
        }
        .loader-spin {
            border-bottom-color: var(--loader-color);
        }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* More opaque dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: var(--app-container-bg); /* Darker background for the modal */
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            position: relative;
            width: 500px; /* Wider modal for content */
            color: var(--text-primary);
        }
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1010;
            transition: background-color 0.2s ease;
        }
        .modal-close:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }
        .modal-heading {
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }
        .modal-subheading {
            color: var(--text-primary);
            font-weight: 500;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .modal-text {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .modal-list {
            list-style: disc;
            margin-left: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        .modal-list-item {
            margin-bottom: 0.25rem;
        }
        .modal-sub-detail-heading {
            color: var(--primary-color-light); /* Accent for sub-details */
            font-weight: 600;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
        }
        .modal-sub-detail-text {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .modal-link {
            color: var(--primary-color-light);
            text-decoration: underline;
        }
    </style>
</head>
<body class="bg-slate-100">
    <div class="w-full max-w-lg mx-auto app-container min-h-screen shadow-lg">
        <header class="header-bg text-white p-4 sticky top-0 z-10 flex items-center shadow-md">
            <a href="index.html" class="mr-4 p-2 rounded-full hover:bg-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="w-10 h-10 bg-white/30 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <div class="ml-4">
                <h1 class="text-xl font-bold">Co-Curricular Activities</h1>
                <p class="text-sm opacity-80">Student Clubs & Units</p>
            </div>
        </header>

        <div id="loader" class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 loader-spin"></div>
        </div>
        <main id="activities-container" class="p-4 sm:p-6 space-y-6">
            </main>
    </div>

    <div id="activity-detail-overlay" class="modal-overlay" onclick="hideActivityDetail()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="hideActivityDetail()">×</button>
            <h3 id="modal-activity-name" class="text-2xl font-bold modal-heading"></h3>
            <p id="modal-activity-description" class="text-base modal-text"></p>
            
            <div id="modal-type-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Type</h4>
                <p id="modal-activity-type" class="text-base modal-text"></p>
            </div>

            <div id="modal-group-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Group</h4>
                <p id="modal-activity-group" class="text-base modal-text"></p>
            </div>

            <div id="modal-credits-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Credits</h4>
                <p id="modal-activity-credits" class="text-base modal-text"></p>
            </div>

            <div id="modal-benefits-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Benefits</h4>
                <ul id="modal-activity-benefits" class="modal-list"></ul>
            </div>

            <div id="modal-contact-person-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Contact Person</h4>
                <p id="modal-activity-contact-person-name" class="text-base modal-text"></p>
                <p id="modal-activity-contact-person-number" class="text-base modal-text"></p>
                <p id="modal-activity-contact-person-email" class="text-base modal-text"></p>
                <p id="modal-activity-contact-person-department" class="text-base modal-text"></p>
            </div>

            <div id="modal-enrollment-process-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Enrollment Process</h4>
                <ul id="modal-activity-enrollment-process" class="modal-list"></ul>
            </div>
            
            <div id="modal-registration-fees-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Registration Fees</h4>
                <p id="modal-activity-registration-fees-status" class="text-base modal-text"></p>
            </div>

            <div id="modal-website-url-container" class="mt-4 border-t border-dark pt-4">
                <h4 class="text-lg font-semibold modal-subheading">Website</h4>
                <a id="modal-activity-website-url" href="#" target="_blank" class="text-base modal-link"></a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- APNA FIREBASE CONFIG YAHAN PASTE KAREIN ---
        const firebaseConfig = {
            apiKey: "AIzaSyB8iYFnVqzBJ2uS6j_LQdF101FL_4ofjjo",
            authDomain: "dsai-app.firebaseapp.com",
            projectId: "dsai-app",
            storageBucket: "dsai-app.appspot.com",
            messagingSenderId: "404556059210",
            appId: "1:404556059210:web:fd8a486f3a864fb6020cb3",
            measurementId: "G-7KXG3VB88C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const activitiesContainer = document.getElementById('activities-container');
        const loader = document.getElementById('loader');

        // Global array to store all fetched activities
        let allActivities = [];

        // Modal Elements
        const activityDetailOverlay = document.getElementById('activity-detail-overlay');
        const modalActivityName = document.getElementById('modal-activity-name');
        const modalActivityDescription = document.getElementById('modal-activity-description');

        const modalTypeContainer = document.getElementById('modal-type-container');
        const modalActivityType = document.getElementById('modal-activity-type');

        const modalGroupContainer = document.getElementById('modal-group-container');
        const modalActivityGroup = document.getElementById('modal-activity-group');

        const modalCreditsContainer = document.getElementById('modal-credits-container');
        const modalActivityCredits = document.getElementById('modal-activity-credits');

        const modalBenefitsContainer = document.getElementById('modal-benefits-container');
        const modalActivityBenefits = document.getElementById('modal-activity-benefits');

        const modalContactPersonContainer = document.getElementById('modal-contact-person-container');
        const modalActivityContactPersonName = document.getElementById('modal-activity-contact-person-name');
        const modalActivityContactPersonNumber = document.getElementById('modal-activity-contact-person-number');
        const modalActivityContactPersonEmail = document.getElementById('modal-activity-contact-person-email'); // New: Email element
        const modalActivityContactPersonDepartment = document.getElementById('modal-activity-contact-person-department');

        const modalEnrollmentProcessContainer = document.getElementById('modal-enrollment-process-container');
        const modalActivityEnrollmentProcess = document.getElementById('modal-activity-enrollment-process');
        
        const modalRegistrationFeesContainer = document.getElementById('modal-registration-fees-container');
        const modalActivityRegistrationFeesStatus = document.getElementById('modal-activity-registration-fees-status');

        const modalWebsiteUrlContainer = document.getElementById('modal-website-url-container');
        const modalActivityWebsiteUrl = document.getElementById('modal-activity-website-url');

        // Function to show the detailed modal
        window.showActivityDetail = (activityId) => {
            const activityData = allActivities.find(act => act.id === activityId);

            if (!activityData) {
                console.error("Activity data not found for ID:", activityId);
                return;
            }

            modalActivityName.textContent = activityData.name || 'No Name';
            modalActivityDescription.textContent = activityData.description || 'No description available.';

            // Type
            if (activityData.type) {
                modalActivityType.textContent = activityData.type;
                modalTypeContainer.style.display = 'block';
            } else {
                modalTypeContainer.style.display = 'none';
            }

            // Group
            if (activityData.group) {
                modalActivityGroup.textContent = activityData.group;
                modalGroupContainer.style.display = 'block';
            } else {
                modalGroupContainer.style.display = 'none';
            }

            // Credits
            if (activityData.credits !== undefined && activityData.credits !== null) {
                modalActivityCredits.textContent = activityData.credits;
                modalCreditsContainer.style.display = 'block';
            } else {
                modalCreditsContainer.style.display = 'none';
            }

            // Benefits
            modalActivityBenefits.innerHTML = '';
            if (activityData.benefits && Array.isArray(activityData.benefits) && activityData.benefits.length > 0) {
                activityData.benefits.forEach(benefit => {
                    const li = document.createElement('li');
                    li.className = 'modal-list-item';
                    li.textContent = benefit;
                    modalActivityBenefits.appendChild(li);
                });
                modalBenefitsContainer.style.display = 'block';
            } else {
                modalBenefitsContainer.style.display = 'none';
            }

            // Contact Person
            if (activityData.contact_person && typeof activityData.contact_person === 'object') {
                modalActivityContactPersonName.textContent = `Name: ${activityData.contact_person.name || 'N/A'}`;
                modalActivityContactPersonNumber.textContent = `Contact: ${activityData.contact_person.contact_number || 'N/A'}`;
                
                // Handle Email
                if (activityData.contact_person.email && activityData.contact_person.email.trim() !== '') {
                    modalActivityContactPersonEmail.textContent = `Email: ${activityData.contact_person.email}`;
                    modalActivityContactPersonEmail.style.display = 'block';
                } else {
                    modalActivityContactPersonEmail.textContent = ''; // Clear content
                    modalActivityContactPersonEmail.style.display = 'none'; // Hide if no email
                }

                // Handle Department
                if (activityData.contact_person.department && activityData.contact_person.department.trim() !== '') {
                    modalActivityContactPersonDepartment.textContent = `Department: ${activityData.contact_person.department}`;
                    modalActivityContactPersonDepartment.style.display = 'block';
                } else {
                    modalActivityContactPersonDepartment.textContent = ''; // Clear content
                    modalActivityContactPersonDepartment.style.display = 'none'; // Hide if no department
                }
                
                modalContactPersonContainer.style.display = 'block';
            } else {
                modalContactPersonContainer.style.display = 'none';
                // Also ensure individual contact person fields are cleared/hidden if the whole container is hidden
                modalActivityContactPersonName.textContent = '';
                modalActivityContactPersonNumber.textContent = '';
                modalActivityContactPersonEmail.textContent = '';
                modalActivityContactPersonEmail.style.display = 'none'; // Explicitly hide email
                modalActivityContactPersonDepartment.textContent = '';
                modalActivityContactPersonDepartment.style.display = 'none'; // Explicitly hide department
            }
            
            // Enrollment Process
            modalActivityEnrollmentProcess.innerHTML = '';
            if (activityData.enrollment_process && Array.isArray(activityData.enrollment_process) && activityData.enrollment_process.length > 0) {
                activityData.enrollment_process.sort((a, b) => parseInt(a.step) - parseInt(b.step)); // Sort by step number
                activityData.enrollment_process.forEach(step => {
                    const li = document.createElement('li');
                    li.className = 'modal-list-item';
                    li.innerHTML = `<span class="modal-sub-detail-heading">Step ${step.step}: ${step.name || 'N/A'}</span><br>${step.details || 'No details.'}`;
                    modalActivityEnrollmentProcess.appendChild(li);
                });
                modalEnrollmentProcessContainer.style.display = 'block';
            } else {
                modalEnrollmentProcessContainer.style.display = 'none';
            }

            // Registration Fees
            if (activityData.registration_fees && typeof activityData.registration_fees === 'object' && activityData.registration_fees.status) {
                modalActivityRegistrationFeesStatus.textContent = `Status: ${activityData.registration_fees.status}`;
                modalRegistrationFeesContainer.style.display = 'block';
            } else {
                modalRegistrationFeesContainer.style.display = 'none';
            }

            // Website URL
            if (activityData.website_url && activityData.website_url.trim() !== '') {
                modalActivityWebsiteUrl.href = activityData.website_url;
                modalActivityWebsiteUrl.textContent = activityData.website_url;
                modalWebsiteUrlContainer.style.display = 'block';
            } else {
                modalWebsiteUrlContainer.style.display = 'none';
            }
            
            activityDetailOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        };

        // Function to hide the detailed modal
        window.hideActivityDetail = () => {
            activityDetailOverlay.classList.remove('visible');
            document.body.style.overflow = ''; // Restore scrolling
        };

        const displayActivities = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "coCurricularActivities"));
                
                if (querySnapshot.empty) {
                    activitiesContainer.innerHTML = '<p class="text-center text-gray-400">No activities found.</p>';
                    return;
                }

                allActivities = []; // Clear previous activities
                querySnapshot.forEach((doc) => {
                    const activity = { id: doc.id, ...doc.data() }; // Store doc.id with activity data
                    allActivities.push(activity);

                    const card = document.createElement('div');
                    card.className = "activity-card";
                    
                    // Only display name and description on the card
                    card.innerHTML = `
                        <div class="activity-card-content">
                            <h3 class="text-lg font-bold activity-title">${activity.name}</h3>
                            <p class="text-sm activity-description-clickable" onclick="showActivityDetail('${activity.id}')">${activity.description}</p>
                        </div>
                    `;
                    activitiesContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching activities data: ", error);
                activitiesContainer.innerHTML = '<p class="text-center text-red-500">Could not load activities data.</p>';
            } finally {
                loader.style.display = 'none';
            }
        };

        displayActivities();
    </script>
</body>
</html>
