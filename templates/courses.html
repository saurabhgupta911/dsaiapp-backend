<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #1a1a1a;
            --bg-app-container: #262626;
            --text-color-primary: #d4d4d4;
            --bg-header: #3f3f46;
            --text-color-header: #f5f5f5;
            --bg-card: #363636;
            --text-color-heading: #a78bfa; /* Purple accent for headings */
            --text-color-subtitle: #c4b5fd;
            --text-color-detail: #a3a3a3;
            --border-color-divider: #4a4a4a;
            --loader-color: #a78bfa;
            --icon-color-header: #f5f5f5;
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page); 
            color: var(--text-color-primary);
        } 
        .app-container {
            background-color: var(--bg-app-container);
            color: var(--text-color-primary);
        }
        .header-bg {
            background-color: var(--bg-header);
            color: var(--text-color-header);
        }
        .header-icon {
            color: var(--icon-color-header);
        }
        .info-card {
            background-color: var(--bg-card);
        }
        .semester-button {
            background-color: var(--bg-card);
            cursor: pointer;
            padding: 1rem;
            transition: background-color 0.2s ease;
            width: 100%;
        }
        .semester-button:hover {
            background-color: #4a4a4a;
        }
        .links-container {
            background-color: #202020;
            padding: 1rem;
            border-top: 1px solid var(--border-color-divider);
        }
        .loader-spin {
            border-bottom-color: var(--loader-color);
        }
    </style>
</head>
<body class="bg-slate-900">
    <div class="w-full max-w-lg mx-auto app-container min-h-screen shadow-lg">
        <header class="header-bg text-white p-4 sticky top-0 z-10 flex items-center shadow-md">
            <a href="index.html" class="mr-4 p-2 rounded-full hover:bg-white/20">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            </div>
            <div class="ml-4">
                <h1 class="text-xl font-bold">Syllabus</h1>
                <p class="text-sm opacity-80">Course Details & Resources</p>
            </div>
        </header>

        <div id="loader" class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 loader-spin"></div>
        </div>
        <main id="syllabus-container" class="p-4 sm:p-6 space-y-4">
            </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8iYFnVqzBJ2uS6j_LQdF101FL_4ofjjo",
            authDomain: "dsai-app.firebaseapp.com",
            projectId: "dsai-app",
            storageBucket: "dsai-app.appspot.com",
            messagingSenderId: "404556059210",
            appId: "1:404556059210:web:fd8a486f3a864fb6020cb3",
            measurementId: "G-7KXG3VB88C"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const syllabusContainer = document.getElementById('syllabus-container');
        const loader = document.getElementById('loader');

        const displaySyllabus = async () => {
            try {
                const docRef = doc(db, "courses", "DSAI");
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    syllabusContainer.innerHTML = '<p class="text-center text-gray-400">Syllabus data not found.</p>';
                    return;
                }

                const courseData = docSnap.data();
                const syllabus = courseData.syllabus;

                if (!syllabus) {
                    syllabusContainer.innerHTML = '<p class="text-center text-gray-400">Syllabus content not found.</p>';
                    return;
                }
                
                // Course Details Card
                const courseDetailsCard = document.createElement('div');
                courseDetailsCard.className = "info-card rounded-lg p-4";
                courseDetailsCard.innerHTML = `
                    <h2 class="text-xl font-bold text-purple-400">${courseData.courseName}</h2>
                    <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
                        <p><strong class="text-slate-400">Duration:</strong> ${courseData.duration_years} years</p>
                        <p><strong class="text-slate-400">Semesters:</strong> ${courseData.duration_semesters}</p>
                        <p><strong class="text-slate-400">Pattern:</strong> ${courseData.pattern}</p>
                        <p><strong class="text-slate-400">Passing Marks:</strong> ${courseData.passing_marks}</p>
                        <p class="col-span-2"><strong class="text-slate-400">Program Code:</strong> ${courseData.programCode}</p>
                    </div>
                `;
                syllabusContainer.appendChild(courseDetailsCard);

                // Semester Buttons
                const semesterKeys = ["sem1",  "sem3", "sem5"];
                semesterKeys.forEach(semKey => {
                    if (syllabus[semKey]) {
                        const semesterData = syllabus[semKey];
                        const semesterDiv = document.createElement('div');
                        
                        // ---- START OF MODIFIED SECTION ----

                        let notesSectionHtml = '';
                        // Check if 'notes' is an array with items
                        if (Array.isArray(semesterData.notes) && semesterData.notes.length > 0) {
                            // Create a link for each subject
                            const subjectLinks = semesterData.notes.map(note => 
                                `<a href="${note.url}" target="_blank" class="block bg-indigo-500 text-white text-center p-2 rounded hover:bg-indigo-600 text-sm">${note.subject}</a>`
                            ).join('');

                            // Create a button that will show/hide the subject links
                            notesSectionHtml = `
                                <div>
                                    <button class="notes-toggle-button w-full bg-purple-600 text-white text-center p-2 rounded hover:bg-purple-700">Notes</button>
                                    <div class="subject-links-container hidden mt-2 space-y-2">
                                        ${subjectLinks}
                                    </div>
                                </div>
                            `;
                        } else {
                            // Fallback for old structure (if you have notes_url)
                            notesSectionHtml = `<a href="${semesterData.notes_url || '#'}" target="_blank" class="block bg-purple-600 text-white text-center p-2 rounded hover:bg-purple-700">Notes</a>`;
                        }

                        const linksHtml = `
                            <div class="links-container hidden rounded-b-lg space-y-2">
                                ${notesSectionHtml}
                                <a href="${semesterData.pyqs_url || '#'}" target="_blank" class="block bg-purple-600 text-white text-center p-2 rounded hover:bg-purple-700">PYQs</a>
                                <a href="${semesterData.syllabus_pdf_url || '#'}" target="_blank" class="block bg-purple-600 text-white text-center p-2 rounded hover:bg-purple-700">Syllabus PDF</a>
                            </div>
                        `;
                        
                        semesterDiv.innerHTML = `
                            <button class="semester-button text-lg font-bold w-full text-left rounded-lg">${semesterData.title || `Semester ${semKey.replace('sem', '')}`}</button>
                            ${linksHtml}
                        `;
                        
                        // Event listener for the main semester button to toggle the links container
                        const semesterButton = semesterDiv.querySelector('.semester-button');
                        semesterButton.addEventListener('click', () => {
                            const links = semesterButton.nextElementSibling;
                            links.classList.toggle('hidden');
                            semesterButton.classList.toggle('rounded-b-lg', links.classList.contains('hidden'));
                        });

                        // Event listener for the new "Notes" toggle button
                        const notesToggleButton = semesterDiv.querySelector('.notes-toggle-button');
                        if (notesToggleButton) {
                            notesToggleButton.addEventListener('click', () => {
                                const subjectLinksDiv = notesToggleButton.nextElementSibling;
                                subjectLinksDiv.classList.toggle('hidden');
                            });
                        }
                        
                        // ---- END OF MODIFIED SECTION ----

                        syllabusContainer.appendChild(semesterDiv);
                    }
                });

            } catch (error) {
                console.error("Error fetching syllabus data: ", error);
                syllabusContainer.innerHTML = '<p class="text-center text-red-500">Could not load syllabus data.</p>';
            } finally {
                loader.style.display = 'none';
            }
        };

        displaySyllabus();
    </script>
</body>
</html>
