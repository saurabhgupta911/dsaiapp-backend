<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAI Faculty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        /* Define CSS Variables for easy theme management */
        :root {
            --bg-page: #1a1a1a;
            --bg-app-container: #262626;
            --text-color-primary: #d4d4d4;
            --bg-header: #3f3f46;
            --text-color-header: #f5f5f5;
            --bg-card: #363636;
            --text-color-name: #a78bfa; /* Purple */
            --text-color-position: #c4b5fd; /* Lighter purple */
            --text-color-department: #a3a3a3; /* Gray */
            --text-color-subjects-header: #f5f5f5;
            --text-color-subject-year: #f5f5f5;
            --text-color-subject-list: #a3a3a3;
            --text-color-no-subjects: #a3a3a3;
            --border-color-divider: #4a4a4a; /* Darker gray for dividers */
            --loader-color: #a78bfa; /* Purple loader */
            --gradient-start: #8b5cf6; /* purple-500 */
            --gradient-end: #7c3aed;   /* indigo-600 */
        }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-color-primary); /* Apply default text color */
        } 
        .app-container {
            background-color: var(--bg-app-container);
            color: var(--text-color-primary);
        }
        .header-bg {
            background-color: var(--bg-header);
            color: var(--text-color-header);
        }
        .faculty-card {
            background-color: var(--bg-card);
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-lg */
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }
        .faculty-card:hover {
            transform: scale(1.02); /* Slight hover effect */
        }
        .faculty-name {
            color: var(--text-color-name);
        }
        .faculty-position {
            color: var(--text-color-position);
        }
        .faculty-department {
            color: var(--text-color-department);
        }
        .subjects-header {
            color: var(--text-color-subjects-header);
        }
        .subject-year {
            color: var(--text-color-subject-year);
        }
        .subject-list {
            color: var(--text-color-subject-list);
        }
        .no-subjects-text {
            color: var(--text-color-no-subjects);
        }
        .border-t-dark { /* Custom class for horizontal rule */
            border-top: 1px solid var(--border-color-divider);
        }
        .loader-spin {
            border-bottom-color: var(--loader-color);
        }
        .initial-icon-bg {
            background: linear-gradient(to bottom right, var(--gradient-start), var(--gradient-end));
        }

        /* --- Image Preview Modal Styles --- */
        .image-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Dark semi-transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Make sure it's on top of everything */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .image-preview-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .image-preview-modal {
            background-color: var(--bg-app-container); /* Using app-container bg for modal */
            padding: 1rem;
            border-radius: 0.75rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .image-preview-modal img {
            max-width: 100%;
            max-height: calc(100vh - 120px); /* Adjust height to leave space for close button */
            object-fit: contain;
            border-radius: 0.5rem;
        }
        .image-preview-close {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1010;
            transition: background-color 0.2s ease;
        }
        .image-preview-close:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-900">

    <div class="w-full max-w-lg mx-auto app-container min-h-screen shadow-lg">
        <header class="header-bg text-white p-4 sticky top-0 z-10 flex items-center shadow-md">
            <a href="index.html" class="mr-4 p-2 rounded-full hover:bg-white/20">
                 <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="ml-4">
                <h1 class="text-xl font-bold">Faculty Information</h1>
                <p class="text-sm opacity-80">DSAI Department</p>
            </div>
        </header>

        <div id="loader" class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-16 w-16 border-b-2 loader-spin"></div>
        </div>
        <main id="faculty-container" class="p-4 sm:p-6 grid grid-cols-1 gap-6">
            </main>
    </div>

    <div id="image-preview-overlay" class="image-preview-overlay" onclick="hideImagePreview()">
        <div class="image-preview-modal" onclick="event.stopPropagation()">
            <button class="image-preview-close" onclick="hideImagePreview()">×</button>
            <img id="preview-image" src="" alt="Faculty Photo Preview">
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- APNA FIREBASE CONFIG YAHAN PASTE KAREIN ---
        const firebaseConfig = {
            apiKey: "AIzaSyB8iYFnVqzBJ2uS6j_LQdF101FL_4ofjjo", // REPLACE WITH YOUR API KEY
            authDomain: "dsai-app.firebaseapp.com", // REPLACE WITH YOUR AUTH DOMAIN
            projectId: "dsai-app", // REPLACE WITH YOUR PROJECT ID
            storageBucket: "dsai-app.appspot.com", // REPLACE WITH YOUR STORAGE BUCKET
            messagingSenderId: "404556059210", // REPLACE WITH YOUR SENDER ID
            appId: "1:404556059210:web:fd8a486f3a864fb6020cb3", // REPLACE WITH YOUR APP ID
            measurementId: "G-7KXG3VB88C" // REPLACE WITH YOUR MEASUREMENT ID (Optional)
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const facultyContainer = document.getElementById('faculty-container');
        const loader = document.getElementById('loader');
        const imagePreviewOverlay = document.getElementById('image-preview-overlay');
        const previewImage = document.getElementById('preview-image');

        const formatSubjects = (subjectTaughtArray) => {
            if (!subjectTaughtArray || subjectTaughtArray.length === 0) {
                return '<p class="text-sm no-subjects-text">No subjects listed.</p>';
            }
            let html = '';
            subjectTaughtArray.forEach(yearBlock => {
                const year = yearBlock.yearAlias || 'N/A';
                const subjects = yearBlock.subjects.join(', ');
                html += `<div class="mt-2"><strong class="font-semibold subject-year">${year}:</strong><span class="subject-list ml-2">${subjects}</span></div>`;
            });
            return html;
        };

        window.showImagePreview = (imageUrl) => {
            previewImage.src = imageUrl;
            imagePreviewOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden'; 
        };

        window.hideImagePreview = () => {
            imagePreviewOverlay.classList.remove('visible');
            document.body.style.overflow = ''; 
        };

        const displayFaculty = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "Faculty"));
                
                querySnapshot.forEach((doc) => {
                    const faculty = doc.data();
                    const card = document.createElement('div');
                    card.className = "faculty-card";
                    
                    let imageHtml = '';
                    if (faculty.photoUrl && faculty.photoUrl.trim() !== '') {
                        imageHtml = `
                            <button class="relative rounded-full overflow-hidden flex-shrink-0 cursor-pointer focus:outline-none" 
                                onclick="showImagePreview('${faculty.photoUrl}')">
                                <img class="h-16 w-16 rounded-full object-cover" src="${faculty.photoUrl}" alt="${faculty.name}">
                            </button>
                        `;
                    } else {
                        imageHtml = `
                            <div class="h-16 w-16 rounded-full initial-icon-bg flex items-center justify-center flex-shrink-0">
                                <span class="text-2xl font-bold text-white">${faculty.name.charAt(0)}</span>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = `
                        <div class="p-6">
                            <div class="flex items-center">
                                <div class="flex-shrink-0">
                                    ${imageHtml}
                                </div>
                                <div class="ml-4">
                                    <div class="text-lg font-bold faculty-name">${faculty.name}</div>
                                    <p class="text-sm font-medium faculty-position">${faculty.position}</p>
                                    <p class="text-xs faculty-department">${faculty.department} Department</p>
                                </div>
                            </div>
                            <div class="mt-4 border-t border-gray-700 pt-4 border-t-dark">
                                <h4 class="text-md font-semibold subjects-header">Subjects Taught</h4>
                                ${formatSubjects(faculty.subjectTaught)}
                            </div>
                        </div>
                    `;
                    facultyContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error fetching faculty data: ", error);
                facultyContainer.innerHTML = '<p class="text-center text-red-500">Could not load faculty data.</p>';
            } finally {
                loader.style.display = 'none';
            }
        };
        displayFaculty();
    </script>
</body>
</html>
