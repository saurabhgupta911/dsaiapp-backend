<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSAI Department Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a1a1a; }
        .app-container { background-color: #262626; color: #d4d4d4; }
        .header-bg { background-color: #3f3f46; color: #f5f5f5; }
        .welcome-text { color: #a78bfa; }
        .welcome-subtitle { color: #a3a3a3; }
        .grid-button {
            color: #ffffff;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .grid-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.3);
        }
        .btn-faculty { background-image: linear-gradient(to right, #8b5cf6, #6d28d9); } /* Purple */
        .btn-timetable { background-image: linear-gradient(to right, #3b82f6, #1d4ed8); } /* Blue */
        .btn-syllabus { background-image: linear-gradient(to right, #10b981, #047857); } /* Green */
        .btn-events { background-image: linear-gradient(to right, #ec4899, #be185d); } /* Pink */
        .btn-placements { background-image: linear-gradient(to right, #f59e0b, #b45309); } /* Amber */
        .btn-cocurricular { background-image: linear-gradient(to right, #ef4444, #b91c1c); } /* Red */
        .btn-admin { background-image: linear-gradient(to right, #64748b, #475569); } /* Slate */
        .btn-library { background-image: linear-gradient(to right, #14b8a6, #0d9488); } /* Teal */
        .btn-sessions { background-image: linear-gradient(to right, #84cc16, #4d7c0f); } /* Lime */
        .nav-bg { background-color: #3f3f46; border-top-color: #52525b; }
        .nav-item .nav-icon { color: #a3a3a3; transition: color 0.2s ease-in-out; width: 28px; height: 28px; }
        .nav-item.active .nav-icon, .nav-item:hover .nav-icon { color: #a78bfa; }
        .nav-item.active .nav-label, .nav-item:hover .nav-label { color: #a78bfa; }
        .overflow-auto::-webkit-scrollbar { display: none; }
        .overflow-auto { -ms-overflow-style: none; scrollbar-width: none; }
        .chat-user-message { background-color: #a78bfa; color: white; }
        .chat-bot-message { background-color: #52525b; color: #d4d4d4; }
        .chat-input-bg { background-color: #262626; color: #d4d4d4; }
        .chat-send-button { background-color: #a78bfa; }
    </style>
</head>
<body class="bg-slate-900">
    <div class="w-full max-w-lg mx-auto app-container h-screen shadow-lg flex flex-col relative overflow-hidden">
        <header class="header-bg text-white p-4 flex-shrink-0 flex items-center shadow-md">
            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" 
                     width="24" 
                     height="24" 
                     viewBox="0 0 24 24" 
                     fill="none" 
                     stroke="currentColor" 
                     stroke-linecap="round" 
                     stroke-linejoin="round" 
                     class="text-white" 
                     style="stroke-width: 1.5px;">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
                    <path d="M9 13a4.5 4.5 0 0 0 3-4"/>
                    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
                    <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
                    <path d="M6 18a4 4 0 0 1-1.967-.516"/>
                    <path d="M12 13h4"/>
                    <path d="M12 18h6a2 2 0 0 1 2 2v1"/>
                    <path d="M12 8h8"/>
                    <path d="M16 8V5a2 2 0 0 1 2-2"/>
                    <circle cx="16" cy="13" r=".5"/>
                    <circle cx="18" cy="3" r=".5"/>
                    <circle cx="20" cy="21" r=".5"/>
                    <circle cx="20" cy="8" r=".5"/>
                </svg>
            </div>
            <div class="ml-4">
                <h1 id="header-title" class="text-xl font-bold">DSAI Department Portal</h1>
                <p id="header-subtitle" class="text-sm opacity-80">Departmental Information Assistant</p>
            </div>
        </header>

        <main class="flex-grow overflow-hidden flex flex-col">
            <section id="home-screen" class="space-y-6 overflow-y-auto p-4 sm:p-6 pb-[90px]">
                <div class="text-center py-4">
                    <h2 class="text-2xl font-bold welcome-text">DSAI Department Portal</h2>
                    <p class="mt-2 welcome-subtitle">Access all departmental resources in one place.</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="location.href='faculty.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-faculty">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span class="mt-2 font-medium">Faculty</span>
                    </button>
                    <button onclick="location.href='timetable.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-timetable">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span class="mt-2 font-medium">Timetable</span>
                    </button>
                    <button onclick="location.href='courses.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-syllabus">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        <span class="mt-2 font-medium">Syllabus</span>
                    </button>
                    <button onclick="location.href='events.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-events">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <span class="mt-2 font-medium">Events</span>
                    </button>
                    <button onclick="location.href='placements.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-placements">
                          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
                        <span class="mt-2 font-medium">Placements</span>
                    </button>
                    <button onclick="location.href='cocurricular.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-cocurricular">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <span class="mt-2 font-medium">Co-curricular</span>
                    </button>
                     <button onclick="location.href='admininfo.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-admin">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        <span class="mt-2 font-medium">Admin Info</span>
                    </button>
                    <button onclick="location.href='library.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button btn-library">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                        <span class="mt-2 font-medium">Library</span>
                    </button>
                    <button onclick="location.href='sessions.html'" class="p-4 rounded-lg shadow-md flex flex-col items-center justify-center text-center transition duration-200 grid-button col-span-2 btn-sessions">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="18" x="3" y="3" rx="1"/><path d="M7 3v18"/><path d="M12.4 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5.6"/><path d="M16 3v18"/></svg>
                        <span class="mt-2 font-medium">Sessions</span>
                    </button>
                </div>
            </section>

            <section id="chatbot-screen" class="flex flex-col h-full hidden">
                <div class="flex-shrink-0 flex items-center justify-between p-2 border-b border-gray-700">
                    <h3 class="text-lg font-semibold text-gray-300">Chat Assistant</h3>
                    <button id="clear-chat-btn" class="text-sm text-purple-400 hover:text-purple-300">Clear Chat</button>
                </div>
                <div id="chat-messages" class="flex-grow space-y-4 overflow-y-auto p-4">
                    </div>
                <form id="chat-form" class="flex-shrink-0 flex items-center p-2 m-4 chat-input-bg rounded-lg shadow-inner">
                    <input type="text" id="user-input" placeholder="Type your question..." class="flex-grow p-2 bg-transparent focus:outline-none text-white">
                    <button type="submit" class="ml-2 p-2 chat-send-button text-white rounded-md hover:opacity-80 transition duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
            </section>
        </main>
        
        <nav class="nav-bg flex-shrink-0 w-full max-w-lg mx-auto flex justify-around items-center p-2 z-20">
            <button id="nav-home" class="nav-item flex flex-col items-center p-2 rounded-lg active" onclick="showScreen('home')">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-xs text-gray-400 nav-label mt-1">Home</span>
            </button>
            <button id="nav-chatbot" class="nav-item flex flex-col items-center p-2 rounded-lg" onclick="showScreen('chatbot')">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 11l-3 3-3-3"/></svg>
                <span class="text-xs text-gray-400 nav-label mt-1">Chat Bot</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB8iYFnVqzBJ2uS6j_LQdF101FL_4ofjjo",
            authDomain: "dsai-app.firebaseapp.com",
            projectId: "dsai-app",
            storageBucket: "dsai-app.appspot.com",
            messagingSenderId: "404556059210",
            appId: "1:404556059210:web:fd8a486f3a864fb6020cb3",
            measurementId: "G-7KXG3VB88C"
        };
        const API_URL = "https://dsaiapp-chatbot.onrender.com/chat";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // --- NEW LOGIC FOR UNIQUE USER SESSIONS ---
        function getOrCreateSessionId() {
            let sessionId = localStorage.getItem('chatbotSessionId');
            if (!sessionId) {
                // Generate a simple unique ID and store it
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('chatbotSessionId', sessionId);
            }
            return sessionId;
        }
        const sessionId = getOrCreateSessionId();
        // --- END OF NEW LOGIC ---

        // IMPORTANT: The database path now includes the unique sessionId
        const chatCollection = collection(db, "conversations", sessionId, "messages");
        
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const homeScreen = document.getElementById('home-screen');
        const chatbotScreen = document.getElementById('chatbot-screen');
        const navHome = document.getElementById('nav-home');
        const navChatbot = document.getElementById('nav-chatbot');
        const clearChatBtn = document.getElementById('clear-chat-btn');

        window.showScreen = (screenName) => {
            homeScreen.classList.add('hidden');
            chatbotScreen.classList.add('hidden');
            navHome.classList.remove('active');
            navChatbot.classList.remove('active');
            if (screenName === 'home') {
                homeScreen.classList.remove('hidden');
                navHome.classList.add('active');
            } else if (screenName === 'chatbot') {
                chatbotScreen.classList.remove('hidden');
                chatbotScreen.classList.add('flex');
                navChatbot.classList.add('active');
                setTimeout(() => chatMessages.scrollTop = chatMessages.scrollHeight, 100);
            }
        };

        const appendMessage = (sender, message) => { 
            const messageElement = document.createElement('div');
            messageElement.className = `flex items-start mb-4 ${sender === 'user' ? 'justify-end' : ''}`;
            if (sender === 'user') {
                messageElement.innerHTML = `
                    <div class="chat-user-message p-3 rounded-lg max-w-[80%] shadow-sm">${message}</div>
                    <div class="w-8 h-8 rounded-full bg-purple-300 flex items-center justify-center flex-shrink-0 ml-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-800"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>`;
            } else {
                messageElement.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center flex-shrink-0 mr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 11l-3 3-3-3"/></svg>
                    </div>
                    <div class="chat-bot-message p-3 rounded-lg max-w-[80%] shadow-sm">${message}</div>`;
            }
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        chatForm.addEventListener('submit', async (e) => { 
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;
            appendMessage('user', message);
            userInput.value = '';
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message })
                });
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const botResponse = data.answer || "Sorry, I couldn't get a response.";
                appendMessage('bot', botResponse);
                await addDoc(chatCollection, { user: message, bot: botResponse, timestamp: new Date() });
            } catch (error) {
                console.error("Error sending message or fetching bot response:", error);
                appendMessage('bot', "Sorry, I'm having trouble connecting right now. Please try again later.");
            }
        });

        const loadMessages = () => { 
            const q = query(chatCollection, orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                chatMessages.innerHTML = ''; // Clear previous messages
                if (snapshot.empty) {
                    // Show initial welcome message only for new chats
                    appendMessage('bot', 'Hello! How can I help you today?');
                } else {
                    snapshot.docs.forEach(doc => {
                        const data = doc.data();
                        appendMessage('user', data.user);
                        appendMessage('bot', data.bot);
                    });
                }
            });
        };
        
        // --- NEW: Clear Chat Functionality ---
        clearChatBtn.addEventListener('click', () => {
            if (confirm("Are you sure you want to clear this conversation?")) {
                // Remove the session ID from storage
                localStorage.removeItem('chatbotSessionId');
                // Reload the page to start a new session
                window.location.reload();
            }
        });

        showScreen('home');
        loadMessages();
    </script>
</body>
</html>
